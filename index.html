<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة البناء المتأرجح - أبراج الحظ</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a2f2a 0%, #0a1f1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Cairo', sans-serif;
            touch-action: manipulation;
        }

        /* حاوية اللعبة */
        .game-container {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 64px;
            padding: 20px 25px 30px 25px;
            backdrop-filter: blur(6px);
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            margin: 20px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 48px;
            box-shadow: 0 12px 28px black;
            background: #87CEEB;
            cursor: pointer;
            background-image: radial-gradient(circle at 30% 40%, rgba(255,240,200,0.2) 2%, transparent 2.5%);
            background-size: 35px 35px;
        }

        /* لوحة المعلومات */
        .info-panel {
            background: #1e2a24e0;
            backdrop-filter: blur(8px);
            border-radius: 60px;
            margin-top: 20px;
            padding: 15px 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            border: 1px solid #ffd966aa;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .stat {
            background: #00000077;
            padding: 8px 18px;
            border-radius: 40px;
            color: #f9e7b3;
            text-shadow: 0 2px 2px black;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .stat span {
            color: #ffd966;
            font-size: 1.6rem;
            font-weight: 900;
            margin-left: 8px;
        }

        .bet-area {
            display: flex;
            gap: 12px;
            background: #00000055;
            padding: 5px 15px;
            border-radius: 50px;
            align-items: center;
        }

        .bet-area label {
            color: #eee;
            font-size: 1.1rem;
        }

        .bet-input {
            background: #fef3c7;
            border: none;
            font-size: 1.3rem;
            font-weight: bold;
            width: 100px;
            text-align: center;
            border-radius: 40px;
            padding: 6px 0;
            font-family: monospace;
            color: #3b2a1f;
        }

        button {
            background: #ffb347;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 8px 22px;
            border-radius: 60px;
            color: #2d1f00;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #8b5a2b;
            font-family: inherit;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #8b5a2b;
        }

        .cashout-btn {
            background: #2ecc71;
            box-shadow: 0 4px 0 #1f8f4b;
            color: white;
            text-shadow: 0 1px 1px darkgreen;
        }

        .reset-btn {
            background: #e67e22;
            box-shadow: 0 4px 0 #b45f1b;
        }

        .floor-mult {
            background: #000000aa;
            border-radius: 30px;
            padding: 5px 12px;
            font-size: 0.9rem;
            color: #ffecb3;
            text-align: center;
        }

        .status {
            background: #2c2c2ccc;
            padding: 6px 18px;
            border-radius: 28px;
            font-size: 1rem;
            color: #ffe5a3;
        }

        .multiplier-badge {
            background: gold;
            color: #1f3a2f;
            border-radius: 30px;
            padding: 5px 15px;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { opacity: 0.7; text-shadow: 0 0 0px gold;}
            100% { opacity: 1; text-shadow: 0 0 6px gold;}
        }
        .excited {
            animation: pulse 0.5s infinite alternate;
        }

        footer {
            font-size: 12px;
            text-align: center;
            color: #b9ad6e;
            margin-top: 12px;
        }
        @media (max-width: 700px) {
            .stat span { font-size: 1.3rem;}
            button { padding: 6px 16px; font-size: 1rem; }
            .bet-input { width: 75px;}
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="1000" height="550" style="width:100%; height:auto; max-width:1000px; aspect-ratio:1000/550"></canvas>
        
        <div class="info-panel">
            <div class="stat">💰 الرصيد: <span id="balanceDisplay">2000</span></div>
            <div class="bet-area">
                <label>🎲 الرهان:</label>
                <input type="number" id="betAmount" class="bet-input" value="50" step="10" min="10" max="2000">
                <button id="placeBetBtn" style="background:#f39c12;">🚀 رهان</button>
            </div>
            <div class="multiplier-badge" id="currentMultiBadge">مضاعف الطابق: 1.00x</div>
            <button id="cashoutBtn" class="cashout-btn">💰 جمع الأرباح</button>
            <button id="resetGameBtn" class="reset-btn">🔄 إعادة تعيين</button>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 12px;">
            <div class="status" id="floorStatus">🏗️ الطابق الحالي: 0 / 0</div>
            <div class="status" id="gameStatusMsg">⚡ اضغط 'رهان' لبدء البناء</div>
        </div>
        <footer>🎯 القاعدة: يجب أن يستقر الطابق على القاعدة أو 50% فوق الطابق السابق ➕ كل طابق يزيد السرعة قليلاً 🌟</footer>
    </div>
</div>

<script>
    (function(){
        // ------------------- إعدادات المضاعفات حسب الطابق (المعطى)
        const MULTIPLIERS = {
            1: 0.5, 2: 0.7, 3: 0.9, 4: 1.1, 5: 1.3,
            6: 1.5, 7: 1.7, 8: 3.0, 9: 5.0, 10: 7.0,
            11: 9.0, 12: 11.0, 13: 15.0
        };
        const MAX_FLOOR = 13;      // أقصى طابق 13

        // عناصر HTML
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const balanceSpan = document.getElementById('balanceDisplay');
        const betInput = document.getElementById('betAmount');
        const placeBtn = document.getElementById('placeBetBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const resetBtn = document.getElementById('resetGameBtn');
        const floorStatusSpan = document.getElementById('floorStatus');
        const gameStatusSpan = document.getElementById('gameStatusMsg');
        const currentMultiBadge = document.getElementById('currentMultiBadge');

        // متغيرات الحالة
        let balance = 2000;               // رصيد ثابت (فيشة الرهان 2000)
        let currentBet = 0;               // قيمة الرهان الحالي (إذا كان في جولة)
        let currentFloor = 0;              // آخر طابق تم بناؤه بنجاح (0 يعني لم يبنى بعد)
        let isGameActive = false;           // هل يوجد رهان نشط و لم يخسر أو يجمع؟
        let pendingWin = 0;                 // الأرباح الحالية (قبل الجمع)
        
        // إعدادات التأرجح للطابق المتحرك (سقوط من أعلى)
        let swingAngle = 0;          // زاوية البندول بالراديان
        let swingSpeed = 0.045;      // السرعة الزاوية (تزداد مع كل طابق)
        let maxSwing = 0.95;          // أقصى زاوية بالراديان (~54 درجة)
        let direction = 1;            // اتجاه التأرجح
        
        // موقع الطابق المتحرك الحالي (الذي يحاول اللاعب تثبيته)
        let movingFloorX = 0;          // مركز x للطابق المتأرجح
        let movingFloorY = 0;
        let movingFloorWidth = 100;
        let movingFloorHeight = 22;
        
        // الطوابق المبنية (ثابتة)
        let builtFloors = [];   // مصفوفة { x, y, width, height, floorNumber }
        
        // القاعدة الأرضية
        const groundY = canvas.height - 38;
        const groundXStart = canvas.width/2 - 140;
        const groundWidth = 280;
        const groundHeight = 18;
        
        // ثوابت الطوابق
        const FLOOR_W = 96;
        const FLOOR_H = 22;
        const BASE_Y_OFFSET = 32;   // أول طابق فوق القاعدة
        
        // متغيرات الرسم والموسيقى (ويب Audio API)
        let bgMusic = null;
        let soundEnabled = true;
        let ambianceGain = null;
        let audioCtx = null;
        
        // تهيئة الصوت (موسيقى خفيفة)
        function initAudio() {
            if(audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                ambianceGain = audioCtx.createGain();
                ambianceGain.gain.value = 0.35;
                ambianceGain.connect(audioCtx.destination);
                // إنشاء موسيقى خلفية بسيطة (loop باستخدام Oscillator هو غير مناسب , سنستخدم مولد نغمات متكرر)
                // سأصنع موجة بسيطة متكررة (نغمة لطيفة) باستخدام setInterval? نفضل أستعمال Buffer? أسهل: تشغيل Oscillator دوري بسيط لكنه موسيقى خفيفة.
                // لتجنب تعقيد, نستخدم Oscillator يعاد إنشاؤه؟ لكن ذلك يسبب تقطيع. سأقوم بصنع "نغمة ambient" بسيطة باستخدام setInterval وتتابع ونغمات لطيفة.
                // لكن الأجمل عمل sound effect في الخلفية بطريقة "موسيقى خلفية متكررة" حبيبة: نستخدم旋律 بسيطة.
                playBackgroundMelody();
            } catch(e){ console.log("audio not supported"); }
        }
        
        let melodyInterval = null;
        let melodyNotes = [261.63, 293.66, 329.63, 261.63, 349.23, 293.66]; // نغمات هادئة
        let noteIndex = 0;
        function playBackgroundMelody() {
            if(melodyInterval) clearInterval(melodyInterval);
            melodyInterval = setInterval(() => {
                if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(ambianceGain);
                osc.type = 'sine';
                osc.frequency.value = melodyNotes[noteIndex % melodyNotes.length];
                gainNode.gain.value = 0.12;
                osc.start();
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
                osc.stop(audioCtx.currentTime + 1.2);
                noteIndex++;
            }, 2800);
        }
        
        function playWinSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ambianceGain);
            osc.type = 'sine';
            osc.frequency.value = 523.25;
            gainNode.gain.value = 0.25;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
            osc.stop(audioCtx.currentTime + 0.5);
            setTimeout(()=>{
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(ambianceGain);
                osc2.frequency.value = 659.25;
                gain2.gain.value = 0.2;
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.7);
                osc2.stop(audioCtx.currentTime + 0.6);
            },150);
        }
        
        function playFailSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ambianceGain);
            osc.type = 'sawtooth';
            osc.frequency.value = 180;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            osc.stop(audioCtx.currentTime + 0.5);
        }
        
        function playBuildSound(){
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ambianceGain);
            osc.frequency.value = 392;
            gainNode.gain.value = 0.15;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            osc.stop(audioCtx.currentTime + 0.25);
        }
        
        // تحديث واجهة الرصيد
        function updateUI() {
            balanceSpan.innerText = Math.floor(balance);
            if(isGameActive && currentBet > 0){
                let multi = getMultiplierForFloor(currentFloor+1);
                let potential = currentBet * multi;
                currentMultiBadge.innerText = `🎯 مضاعف الطابق ${currentFloor+1}: ${multi.toFixed(2)}x (ربح: ${Math.floor(potential)})`;
            } else {
                currentMultiBadge.innerText = `⚙️ مضاعف الطابق --`;
            }
            floorStatusSpan.innerHTML = `🏗️ الطابق المبني: ${currentFloor} / ${MAX_FLOOR}`;
        }
        
        function getMultiplierForFloor(floorNumber){
            if(floorNumber <= 0) return 0;
            if(floorNumber > MAX_FLOOR) return MULTIPLIERS[MAX_FLOOR] || 15;
            return MULTIPLIERS[floorNumber] || (0.5 + (floorNumber-1)*0.2);
        }
        
        // حساب السرعة الزاوية حسب الطابق الحالي (تزداد قليلا كل طابق)
        function calcSwingSpeed(baseFloor){
            // السرعة الأساسية 0.045 + زيادة 0.008 لكل طابق مبني (بحد أقصى 0.15)
            let extra = Math.min(0.095, baseFloor * 0.007);
            return 0.045 + extra;
        }
        
        // بدء جولة جديدة (رهان)
        function startBet() {
            if(isGameActive){
                gameStatusSpan.innerText = "⚠️ أنهِ الجولة أولاً أو اجمع!";
                return;
            }
            let betValue = parseInt(betInput.value);
            if(isNaN(betValue) || betValue <= 0) betValue = 10;
            if(betValue > balance){
                gameStatusSpan.innerText = "❌ رصيد غير كافٍ!";
                return;
            }
            if(betValue < 10) betValue = 10;
            if(betValue > 2000) betValue = 2000;
            
            // خصم الرهان
            balance -= betValue;
            currentBet = betValue;
            pendingWin = 0;
            currentFloor = 0;
            builtFloors = [];
            isGameActive = true;
            
            // إعادة تعيين معلمات التأرجح
            swingAngle = 0;
            direction = 1;
            swingSpeed = calcSwingSpeed(0);
            // بناء القاعدة (أرضية)
            builtFloors.push({ x: groundXStart, y: groundY - groundHeight/2, width: groundWidth, height: groundHeight, isGround: true, floorNumber:0 });
            
            updateUI();
            gameStatusSpan.innerText = `🎉 بدأ بناء الطابق الأول! حرك الفأرة/المس لتثبيت الطابق 🎉`;
            playBuildSound();
            initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        // وظيفة محاولة تثبيت الطابق المتأرجح
        function attemptPlaceFloor(){
            if(!isGameActive) {
                gameStatusSpan.innerText = "لا توجد جولة نشطة، راهن أولا";
                return false;
            }
            if(currentFloor >= MAX_FLOOR){
                // تم إكمال جميع الطوابق ، نجاح تلقائي + جمع تلقائي اختياري لكن نمنحه الجمع التلقائي
                gameStatusSpan.innerText = "🏆 أكملت البرج بالكامل! تم جمع الأرباح تلقائياً 🏆";
                cashout(true);
                return false;
            }
            
            // تحديد موقع الطابق الحالي المتأرجح
            let targetFloorNumber = currentFloor + 1;
            // إحداثيات الطابق المتأرجح (مركز)
            let floorCenterX = movingFloorX;
            let floorCenterY = movingFloorY;
            let rect = { x: floorCenterX - FLOOR_W/2, y: floorCenterY - FLOOR_H/2, w: FLOOR_W, h: FLOOR_H };
            
            // القاعدة المرجعية: الطابق السابق (آخر طابق ثابت)
            let lastFloor = builtFloors[builtFloors.length-1];
            if(!lastFloor){
                return false;
            }
            let lastRect = { x: lastFloor.x - lastFloor.width/2, y: lastFloor.y - lastFloor.height/2, w: lastFloor.width, h: lastFloor.height };
            
            // التحقق من التداخل: يجب أن يكون 50% من الطابق الجديد فوق الطابق السابق
            // نحسب المساحة المتداخلة في الإسقاط الأفقي (نسبة العرض المتداخل)
            let overlapLeft = Math.max(rect.x, lastRect.x);
            let overlapRight = Math.min(rect.x+rect.w, lastRect.x+lastRect.w);
            let overlapWidth = overlapRight - overlapLeft;
            if(overlapWidth <= 0){
                gameStatusSpan.innerText = "💥 فشل! الطابق لم يلمس الطابق السابق! خسارة! 💥";
                loseGame();
                return false;
            }
            let requiredOverlap = FLOOR_W * 0.5; // 50% من عرض الطابق الجديد
            if(overlapWidth < requiredOverlap){
                gameStatusSpan.innerText = `💔 تداخل ${Math.floor(overlapWidth)}px فقط, يجب 50% من العرض (${requiredOverlap}px) خسارة!`;
                loseGame();
                return false;
            }
            
            // التحقق العمودي: يجب أن يكون الطابق الجديد قريباً من السابق (يلمسه من الأعلى تقريبا)
            let verticalGap = Math.abs(rect.y - (lastRect.y+lastRect.h));
            if(verticalGap > 14){
                gameStatusSpan.innerText = "⚠️ الطابق بعيد جداً عمودياً! خسارة!";
                loseGame();
                return false;
            }
            
            // نجاح التثبيت !!!
            playBuildSound();
            // إضافة الطابق الحالي إلى المبنى
            let newFloor = {
                x: floorCenterX,
                y: floorCenterY,
                width: FLOOR_W,
                height: FLOOR_H,
                floorNumber: targetFloorNumber
            };
            builtFloors.push(newFloor);
            currentFloor = targetFloorNumber;
            
            // حساب الأرباح المعلقة بناءً على المضاعف الحالي
            let multiplier = getMultiplierForFloor(currentFloor);
            pendingWin = currentBet * multiplier;
            
            updateUI();
            
            // إذا وصل لأخر طابق ، إتمام الفوز
            if(currentFloor >= MAX_FLOOR){
                gameStatusSpan.innerText = "🎉 أكملت كل الطوابق! أرباحك جاهزة للجمع! 🎉";
                playWinSound();
                updateUI();
                return true;
            }
            
            // زيادة السرعة قليلاً لكل طابق
            swingSpeed = calcSwingSpeed(currentFloor);
            gameStatusSpan.innerText = `✅ تم بناء الطابق ${currentFloor}! المضاعف ${multiplier.toFixed(2)}x │ أرباحك الحالية: ${Math.floor(pendingWin)} 💎`;
            updateUI();
            return true;
        }
        
        function loseGame(){
            if(!isGameActive) return;
            // خسارة كاملة: الرهان محسوم مسبقا, يخسر كل تقدمه, we reset state, لا أرباح
            isGameActive = false;
            currentBet = 0;
            pendingWin = 0;
            currentFloor = 0;
            builtFloors = [];
            playFailSound();
            gameStatusSpan.innerText = "💀 خسارة! لقد سقط الطابق! ابدأ رهاناً جديداً 💀";
            updateUI();
        }
        
        // جمع الأرباح (Cashout)
        function cashout(forceAuto = false){
            if(!isGameActive && !forceAuto){
                gameStatusSpan.innerText = "لا توجد أرباح نشطة للجمع";
                return;
            }
            if(pendingWin <= 0 && isGameActive){
                gameStatusSpan.innerText = "⚠️ لم تحقق أرباح بعد، ابن طابقاً أولاً!";
                return;
            }
            let profit = Math.floor(pendingWin);
            if(profit > 0){
                balance += profit;
                playWinSound();
                gameStatusSpan.innerText = `💰 قمت بجمع ${profit} ! رصيدك الآن ${Math.floor(balance)} 💰`;
            } else {
                gameStatusSpan.innerText = `❗ لا يوجد ربح للجمع.`;
            }
            // إنهاء الجولة
            isGameActive = false;
            currentBet = 0;
            pendingWin = 0;
            currentFloor = 0;
            builtFloors = [];
            updateUI();
        }
        
        function resetGameFull(){
            balance = 2000;
            isGameActive = false;
            currentBet = 0;
            pendingWin = 0;
            currentFloor = 0;
            builtFloors = [];
            updateUI();
            gameStatusSpan.innerText = "تم إعادة التعيين. رصيدك 2000";
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        // تحديث حركة البندول (الطابق المتحرك) حسب السرعة
        function updateSwing(){
            if(!isGameActive) return;
            swingAngle += direction * swingSpeed;
            if(swingAngle > maxSwing){
                swingAngle = maxSwing;
                direction = -1;
            } else if(swingAngle < -maxSwing){
                swingAngle = -maxSwing;
                direction = 1;
            }
            // تحديد نقطة التعليق في أعلى المنتصف
            let pivotX = canvas.width/2;
            let pivotY = 45;   // حبل من الأعلى
            let ropeLength = 170;
            // إزاحة أفقية
            let offsetX = Math.sin(swingAngle) * ropeLength;
            let centerX = pivotX + offsetX;
            // الموقع الرأسي ثابت تقريبا (يتأرجح مثل البندول)
            let centerY = pivotY + ropeLength * (1 - Math.cos(swingAngle*0.6)) * 0.3 + 35;
            movingFloorX = centerX;
            movingFloorY = centerY;
        }
        
        // الرسم الكامل
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // السماء
            ctx.fillStyle = "#b0e2ff";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#f9e0a0";
            for(let i=0;i<80;i++) ctx.fillRect(20+ i*37, 40, 2, 2);
            // رسم القاعدة
            let ground = builtFloors.find(f=>f.isGround) || { x: groundXStart, y: groundY - groundHeight/2, width: groundWidth, height: groundHeight };
            ctx.shadowBlur=0;
            ctx.fillStyle = "#b97f44";
            ctx.fillRect(ground.x-ground.width/2, ground.y-ground.height/2, ground.width, ground.height);
            ctx.fillStyle = "#9c5e2c";
            ctx.fillRect(ground.x-ground.width/2+5, ground.y-ground.height/2, ground.width-10, 5);
            
            // رسم الطوابق المبنية
            for(let i=1;i<builtFloors.length;i++){
                let f = builtFloors[i];
                ctx.fillStyle = "#ddbb77";
                ctx.shadowBlur=4;
                ctx.fillRect(f.x - f.width/2, f.y - f.height/2, f.width, f.height);
                ctx.fillStyle = "#b97f44";
                ctx.fillRect(f.x - f.width/2+3, f.y - f.height/2, f.width-6, 5);
                ctx.fillStyle = "white";
                ctx.font = "bold 16px 'Segoe UI'";
                ctx.shadowBlur=2;
                ctx.fillStyle = "#4a2a0e";
                ctx.fillText(`${f.floorNumber}`, f.x-10, f.y+6);
            }
            
            // رسم الحبل والطابق المتأرجح (الحالي)
            if(isGameActive && currentFloor < MAX_FLOOR){
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, 45);
                ctx.lineTo(movingFloorX, movingFloorY - FLOOR_H/2+5);
                ctx.strokeStyle = "#8B5A2B";
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.fillStyle = "#f4bc6e";
                ctx.shadowBlur=6;
                ctx.fillRect(movingFloorX - FLOOR_W/2, movingFloorY - FLOOR_H/2, FLOOR_W, FLOOR_H);
                ctx.fillStyle = "#c9863a";
                ctx.fillRect(movingFloorX - FLOOR_W/2+4, movingFloorY - FLOOR_H/2, FLOOR_W-8, 6);
                ctx.fillStyle = "brown";
                ctx.font = "bold 14px monospace";
                ctx.fillText(`${currentFloor+1}`, movingFloorX-6, movingFloorY+4);
            }
            // نص حماسي
            ctx.font = "bold 20vmin 'Poppins'";
            ctx.fillStyle = "#fff8e7aa";
            if(isGameActive && pendingWin>0) {
                ctx.font = "bold 26px system-ui";
                ctx.fillStyle = "#ffd966";
                ctx.fillText(`💰 ${Math.floor(pendingWin)}`, canvas.width-120, 55);
            }
        }
        
        // حلقة التحديث
        let lastTimestamp=0;
        function animate(){
            updateSwing();
            draw();
            requestAnimationFrame(animate);
        }
        
        // التعامل مع محاولة التثبيت عند النقر أو اللمس
        function handlePlaceTap(e){
            e.preventDefault();
            if(isGameActive){
                attemptPlaceFloor();
            } else {
                gameStatusSpan.innerText = "ابدأ رهان أولاً!";
            }
        }
        
        // الأحداث
        canvas.addEventListener('click', handlePlaceTap);
        canvas.addEventListener('touchstart', handlePlaceTap);
        placeBtn.addEventListener('click', ()=>{
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            startBet();
        });
        cashoutBtn.addEventListener('click', ()=>{
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            cashout(false);
        });
        resetBtn.addEventListener('click', ()=>{
            resetGameFull();
        });
        
        // ضبط أولي
        resetGameFull();
        builtFloors.push({ x: groundXStart, y: groundY - groundHeight/2, width: groundWidth, height: groundHeight, isGround: true, floorNumber:0 });
        updateUI();
        animate();
        // بدء صوت تلقائي بعد أي تفاعل
        document.body.addEventListener('click', ()=>{
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, {once: true});
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>أبراج الحظ - لعبة البناء المتأرجح</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(145deg, #0a2f2a 0%, #061a15 100%);
            font-family: 'Segoe UI', 'Poppins', 'Cairo', sans-serif;
            touch-action: pan-x pan-y;
        }

        /* الحاوية الرئيسية ملء الشاشة */
        .game-fullscreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 30% 20%, #2d6a4f33, #0a1f1a);
        }

        /* منطقة اللعبة (الكانفس) - تأخذ كل المساحة المتاحة */
        .canvas-area {
            flex: 1;
            min-height: 0;
            position: relative;
            background: #87CEEB;
            background-image: radial-gradient(circle at 25% 40%, rgba(255,245,200,0.25) 2%, transparent 2.5%);
            background-size: 45px 45px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
        }

        /* الشريط السفلي - فقط أزرار ومعلومات */
        .bottom-bar {
            background: #1a2a24f0;
            backdrop-filter: blur(16px);
            border-top: 2px solid #ffd966aa;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .balance-card {
            background: #00000088;
            padding: 6px 18px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f9e7b3;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .balance-card span {
            color: #ffd966;
            font-size: 1.6rem;
            font-weight: 900;
        }

        .bet-fixed {
            background: #e67e22;
            padding: 6px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #a04000;
        }

        button {
            background: #ffb347;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 8px 28px;
            border-radius: 60px;
            color: #2d1f00;
            cursor: pointer;
            transition: 0.07s linear;
            box-shadow: 0 5px 0 #8b5a2b;
            font-family: inherit;
            min-width: 110px;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #8b5a2b;
        }

        .cashout-btn {
            background: #2ecc71;
            box-shadow: 0 5px 0 #1f8f4b;
            color: white;
            text-shadow: 0 1px 1px darkgreen;
        }

        .reset-btn {
            background: #e67e22;
            box-shadow: 0 5px 0 #b45f1b;
        }

        .drop-btn {
            background: #3498db;
            box-shadow: 0 5px 0 #1f618d;
            color: white;
            font-size: 1.3rem;
        }

        .status-text {
            background: #000000aa;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #ffe5a3;
        }

        .multiplier-badge {
            background: gold;
            color: #1f3a2f;
            border-radius: 30px;
            padding: 5px 18px;
            font-weight: bold;
            font-size: 1rem;
        }

        @media (max-width: 700px) {
            .bottom-bar { gap: 8px; padding: 10px 12px; }
            button { padding: 6px 16px; font-size: 0.9rem; min-width: 80px; }
            .balance-card span { font-size: 1.3rem; }
            .multiplier-badge { font-size: 0.75rem; padding: 4px 10px; }
            .status-text { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="game-fullscreen">
    <div class="canvas-area">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div class="bottom-bar">
        <div class="balance-card">💰 الرصيد: <span id="balanceDisplay">2000</span></div>
        <div class="bet-fixed">🎲 الرهان: 2000 ثابت</div>
        <div class="multiplier-badge" id="multiplierBadge">🏆 مضاعف: 0.00x</div>
        <button id="dropBtn" class="drop-btn">⬇️ إفلات الطابق</button>
        <button id="cashoutBtn" class="cashout-btn">💰 جمع الأرباح</button>
        <button id="resetBtn" class="reset-btn">🔄 إعادة</button>
    </div>
    <div style="background: #0f1915dd; text-align: center; padding: 5px; font-size: 12px; color: #e6cba0;">
        <span id="gameStatusMsg">✨ اضغط "إفلات الطابق" لبدء البناء ✨</span>
    </div>
</div>

<script>
    (function(){
        // ---------- إعدادات اللعبة ----------
        const canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        
        // مضاعفات الطوابق (حسب المطلوب)
        const MULTIPLIERS = {
            1: 0.5, 2: 0.7, 3: 0.9, 4: 1.1, 5: 1.3,
            6: 1.5, 7: 1.7, 8: 3.0, 9: 5.0, 10: 7.0,
            11: 9.0, 12: 11.0, 13: 15.0
        };
        const MAX_FLOOR = 13;
        const FIXED_BET = 2000;   // رهان ثابت
        
        // متغيرات الحالة
        let balance = 2000;                 // رصيد المستخدم
        let currentBet = 0;                // الرهان (سيكون 2000 عند بدء الجولة)
        let currentFloor = 0;              // آخر طابق تم بناؤه بنجاح (0 = لا شيء)
        let isGameActive = false;           // هل توجد جولة نشطة (رهان مفعل و لم يخسر أو يجمع)
        let pendingProfit = 0;              // الأرباح المتراكمة (لا تضاف للرصيد الا عند الجمع)
        
        // عناصر HTML
        const balanceSpan = document.getElementById('balanceDisplay');
        const multiplierBadge = document.getElementById('multiplierBadge');
        const gameStatusSpan = document.getElementById('gameStatusMsg');
        const dropBtn = document.getElementById('dropBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // ---------- الطوابق المبنية (ثابتة) ----------
        let builtFloors = [];    // كل طابق ثابت { x, y, w, h, floorNumber }
        
        // معطيات القاعدة الأرضية (ستتغير حسب حجم الكانفس)
        let ground = { x: 0, y: 0, w: 220, h: 22 };
        
        // الطابق المُعلَّق المتأرجح
        let swingingFloor = {
            x: 0, y: 0,            // المركز
            w: 90,
            h: 28,
            angle: 0,
            speed: 0.045,
            direction: 1,
            maxAngle: 0.85,
            pivotX: 0,
            pivotY: 65,            // نقطة تعليق من الأعلى (نسبة)
            ropeLength: 170
        };
        
        // حالة السقوط الحر (عند الضغط على زر الإفلات)
        let isFalling = false;
        let fallVelocityY = 0;
        let fallPosX = 0, fallPosY = 0;
        let fallWidth = 90, fallHeight = 28;
        let fallFloorNumber = 0;   // رقم الطابق الذي نحاول وضعه
        
        // متغيرات الـ 50% للتحقق
        let waitingForLanding = false; // بعد الإفلات ننتظر الارتطام
        
        // موسيقى خلفية (نظام بسيط)
        let audioCtx = null;
        let bgGain = null;
        let melodyInterval = null;
        let soundEnabled = true;
        
        // وظائف الصوت
        function initAudio() {
            if(audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgGain = audioCtx.createGain();
                bgGain.gain.value = 0.25;
                bgGain.connect(audioCtx.destination);
                playAmbientMelody();
            } catch(e){ console.log("audio not supported"); }
        }
        
        function playAmbientMelody() {
            if(melodyInterval) clearInterval(melodyInterval);
            melodyInterval = setInterval(() => {
                if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
                const notes = [262, 294, 330, 262, 349, 330];
                const idx = Math.floor(Math.random() * notes.length);
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(bgGain);
                osc.type = 'sine';
                osc.frequency.value = notes[idx];
                gainNode.gain.value = 0.1;
                osc.start();
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
                osc.stop(audioCtx.currentTime + 1.4);
            }, 3200);
        }
        
        function playBuildSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'sine';
            osc.frequency.value = 440;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
            osc.stop(audioCtx.currentTime + 0.23);
        }
        
        function playWinSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'triangle';
            osc.frequency.value = 523.25;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            osc.stop(audioCtx.currentTime + 0.48);
            setTimeout(()=>{
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(bgGain);
                osc2.frequency.value = 659.25;
                gain2.gain.value = 0.18;
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
                osc2.stop(audioCtx.currentTime + 0.58);
            },120);
        }
        
        function playFailSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'sawtooth';
            osc.frequency.value = 160;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.45);
            osc.stop(audioCtx.currentTime + 0.43);
        }
        
        // تحديث واجهة المستخدم
        function updateUI() {
            balanceSpan.innerText = Math.floor(balance);
            if(isGameActive && currentFloor > 0){
                let nextMulti = (currentFloor + 1 <= MAX_FLOOR) ? MULTIPLIERS[currentFloor+1] : MULTIPLIERS[MAX_FLOOR];
                multiplierBadge.innerText = `🎯 مضاعف الطابق ${currentFloor+1}: ${nextMulti.toFixed(2)}x`;
            } else if(isGameActive && currentFloor === 0){
                multiplierBadge.innerText = `🎯 مضاعف الطابق 1: 0.50x`;
            } else {
                multiplierBadge.innerText = `🏆 مضاعف: ----`;
            }
        }
        
        // الحصول على مضاعف الطابق المطلوب
        function getMultiplier(floorNum) {
            if(floorNum <= 0) return 0;
            if(floorNum > MAX_FLOOR) return MULTIPLIERS[MAX_FLOOR];
            return MULTIPLIERS[floorNum] || 0.5;
        }
        
        // حساب السرعة المتزايدة (تزداد قليلاً مع كل طابق)
        function calcSwingSpeed(baseFloor) {
            let extra = Math.min(0.09, baseFloor * 0.007);
            return 0.045 + extra;
        }
        
        // بدء جولة جديدة (رهان ثابت 2000)
        function startNewGame() {
            if(isGameActive){
                gameStatusSpan.innerText = "⚠️ أنهِ الجولة أولاً (اجمع أو اخسر)";
                return;
            }
            if(balance < FIXED_BET) {
                gameStatusSpan.innerText = "❌ رصيدك أقل من 2000! أعد التعيين.";
                return;
            }
            // خصم الرهان
            balance -= FIXED_BET;
            currentBet = FIXED_BET;
            pendingProfit = 0;
            currentFloor = 0;
            isGameActive = true;
            waitingForLanding = false;
            isFalling = false;
            
            // إعادة بناء الطوابق الثابتة (القاعدة فقط)
            builtFloors = [];
            addGround();
            
            // إعادة ضبط البندول (الطابق المتأرجح في الأعلى)
            resetSwingingFloor();
            swingingFloor.speed = calcSwingSpeed(0);
            
            updateUI();
            gameStatusSpan.innerText = "🎉 جولة جديدة! اضغط 'إفلات الطابق' لوضع الطابق الأول على القاعدة 🎉";
            playBuildSound();
            initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        function addGround() {
            // القاعدة الأرضية في الأسفل بنسبة 85% من ارتفاع الكانفس تقريباً
            let groundY = canvas.height - 42;
            let groundX = canvas.width/2 - 110;
            ground = { x: groundX, y: groundY, w: 220, h: 22 };
            builtFloors.push({ 
                x: groundX + ground.w/2, 
                y: groundY + ground.h/2, 
                w: ground.w, 
                h: ground.h, 
                floorNumber: 0, 
                isGround: true 
            });
        }
        
        function resetSwingingFloor() {
            let pivotX = canvas.width/2;
            let pivotY = 70;
            swingingFloor.pivotX = pivotX;
            swingingFloor.pivotY = pivotY;
            swingingFloor.angle = 0;
            swingingFloor.direction = 1;
            swingingFloor.maxAngle = 0.85;
            // تحديث موقع الطابق حسب الزاوية
            updateSwingPosition();
        }
        
        function updateSwingPosition() {
            let angle = swingingFloor.angle;
            let offsetX = Math.sin(angle) * swingingFloor.ropeLength;
            let centerX = swingingFloor.pivotX + offsetX;
            let verticalOffset = (1 - Math.cos(angle * 0.7)) * 22;
            let centerY = swingingFloor.pivotY + swingingFloor.ropeLength * 0.75 + verticalOffset;
            swingingFloor.x = centerX;
            swingingFloor.y = centerY;
        }
        
        // تحديث حركة البندول (إذا لم يكن في حالة سقوط)
        function updateSwing() {
            if(isGameActive && !waitingForLanding && !isFalling) {
                swingingFloor.angle += swingingFloor.direction * swingingFloor.speed;
                if(swingingFloor.angle > swingingFloor.maxAngle) {
                    swingingFloor.angle = swingingFloor.maxAngle;
                    swingingFloor.direction = -1;
                } else if(swingingFloor.angle < -swingingFloor.maxAngle) {
                    swingingFloor.angle = -swingingFloor.maxAngle;
                    swingingFloor.direction = 1;
                }
                updateSwingPosition();
            }
        }
        
        // دالة الإفلات - يبدأ السقوط الحر للطابق المتأرجح من موقعه الحالي
        function dropFloor() {
            if(!isGameActive) {
                gameStatusSpan.innerText = "لا توجد جولة نشطة! راهن تلقائياً بزر 'إعادة' أو ابدأ جولة جديدة.";
                return;
            }
            if(waitingForLanding || isFalling) {
                gameStatusSpan.innerText = "الطابق في حالة سقوط بالفعل! انتظر.";
                return;
            }
            // نأخذ موقع الطابق المتأرجح الحالي
            fallPosX = swingingFloor.x;
            fallPosY = swingingFloor.y;
            fallWidth = swingingFloor.w;
            fallHeight = swingingFloor.h;
            fallFloorNumber = currentFloor + 1;
            isFalling = true;
            waitingForLanding = true;
            fallVelocityY = 2.5;   // سرعة أولية للهبوط
            gameStatusSpan.innerText = `💨 الطابق ${fallFloorNumber} يسقط... انتظر الهبوط 💨`;
        }
        
        // تحديث السقوط والتحقق من التصادم بنسبة 50%
        function updateFall() {
            if(!isFalling) return false;
            // زيادة سرعة السقوط (جاذبية)
            fallVelocityY += 0.8;
            fallPosY += fallVelocityY;
            
            // الحصول على الجسم الذي سنرتطم به (آخر طابق مبني)
            if(builtFloors.length === 0) return false;
            let lastFloor = builtFloors[builtFloors.length-1];
            let lastLeft = lastFloor.x - lastFloor.w/2;
            let lastRight = lastFloor.x + lastFloor.w/2;
            let lastTop = lastFloor.y - lastFloor.h/2;
            let lastBottom = lastFloor.y + lastFloor.h/2;
            
            let fallLeft = fallPosX - fallWidth/2;
            let fallRight = fallPosX + fallWidth/2;
            let fallTop = fallPosY - fallHeight/2;
            let fallBottom = fallPosY + fallHeight/2;
            
            // التحقق من التصادم العمودي (لمس السطح)
            if(fallBottom >= lastTop && fallTop <= lastBottom && fallVelocityY >= 0) {
                // التحقق من التداخل الأفقي بنسبة 50% من عرض الطابق الجديد
                let overlapLeft = Math.max(fallLeft, lastLeft);
                let overlapRight = Math.min(fallRight, lastRight);
                let overlapWidth = overlapRight - overlapLeft;
                let requiredOverlap = fallWidth * 0.5;
                if(overlapWidth >= requiredOverlap) {
                    // نجاح التثبيت
                    let newFloorX = fallPosX;
                    let newFloorY = lastTop - fallHeight/2;  // يثبت فوق السطح
                    let newFloor = {
                        x: newFloorX,
                        y: newFloorY,
                        w: fallWidth,
                        h: fallHeight,
                        floorNumber: fallFloorNumber
                    };
                    builtFloors.push(newFloor);
                    currentFloor = fallFloorNumber;
                    
                    // حساب الأرباح المتراكمة (المضاعف حسب الطابق)
                    let multiplier = getMultiplier(currentFloor);
                    pendingProfit = currentBet * multiplier;
                    
                    playBuildSound();
                    gameStatusSpan.innerText = `✅ تم بناء الطابق ${currentFloor}! المضاعف ${multiplier.toFixed(2)}x | أرباحك الحالية: ${Math.floor(pendingProfit)} 💰 اضغط "جمع" لسحبها`;
                    updateUI();
                    
                    // إنهاء السقوط
                    isFalling = false;
                    waitingForLanding = false;
                    
                    // زيادة سرعة التأرجح للطابق التالي
                    if(currentFloor < MAX_FLOOR) {
                        swingingFloor.speed = calcSwingSpeed(currentFloor);
                        resetSwingingFloor();
                    } else {
                        // تم الانتهاء من كل الطوابق
                        gameStatusSpan.innerText = "🏆 أكملت البرج بالكامل! يمكنك جمع الأرباح 🏆";
                        playWinSound();
                    }
                    return true;
                } else {
                    // فشل: لم يحقق 50% تداخل
                    gameStatusSpan.innerText = `💥 تداخل ${Math.floor(overlapWidth)}px فقط (يلزم 50% = ${Math.floor(requiredOverlap)}px) 🔻 خسارة! 🔻`;
                    loseGame();
                    return false;
                }
            }
            // إذا تجاوز الطابق أرضية اللوحة أو الأسفل بشكل مفرط -> خسارة
            if(fallPosY + fallHeight/2 > canvas.height + 100) {
                gameStatusSpan.innerText = "💀 الطابق سقط خارج الحدود! خسارة 💀";
                loseGame();
                return false;
            }
            return true;
        }
        
        function loseGame() {
            if(!isGameActive) return;
            playFailSound();
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            isFalling = false;
            waitingForLanding = false;
            updateUI();
            gameStatusSpan.innerText = "😭 خسارة! ابدأ جولة جديدة (اضغط إعادة أو بدأ تلقائي) 😭";
        }
        
        // جمع الأرباح (لا يضاف ربح الا عند الضغط)
        function cashout() {
            if(!isGameActive) {
                gameStatusSpan.innerText = "لا توجد أرباح نشطة للجمع! ابدأ جولة أولاً.";
                return;
            }
            if(pendingProfit <= 0) {
                gameStatusSpan.innerText = "⚠️ لم تحقق أي أرباح بعد! ابنِ طابقاً أولاً ثم اجمع.";
                return;
            }
            let profitToAdd = Math.floor(pendingProfit);
            balance += profitToAdd;
            playWinSound();
            gameStatusSpan.innerText = `💰 تم جمع ${profitToAdd} ! رصيدك الآن ${Math.floor(balance)} 💰`;
            // إنهاء الجولة (حفظ الأرباح)
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            isFalling = false;
            waitingForLanding = false;
            updateUI();
        }
        
        function resetGameFull() {
            balance = 2000;
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            isFalling = false;
            waitingForLanding = false;
            addGround();   // إعادة القاعدة
            updateUI();
            gameStatusSpan.innerText = "🔄 تم إعادة التعيين. الرصيد 2000. اضغط إعادة أو جولة جديدة يدوياً (ستبدأ تلقائياً بالرهان)";
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        // رسم طابع جميل: شباكين وباب
        function drawFancyFloor(x, y, w, h, floorNum, isGround=false) {
            ctx.fillStyle = "#DEB887";
            ctx.shadowBlur = 3;
            ctx.fillRect(x - w/2, y - h/2, w, h);
            ctx.fillStyle = "#C19A6B";
            ctx.fillRect(x - w/2 + 5, y - h/2, w - 10, 6);
            if(!isGround) {
                // شباكان صغيران
                ctx.fillStyle = "#87CEEB";
                ctx.fillRect(x - w/3 - 8, y - 4, 18, 18);
                ctx.fillRect(x + w/3 - 10, y - 4, 18, 18);
                ctx.fillStyle = "#2C3E50";
                ctx.fillRect(x - w/3 - 6, y - 2, 14, 14);
                ctx.fillRect(x + w/3 - 8, y - 2, 14, 14);
                // باب صغير
                ctx.fillStyle = "#8B4513";
                ctx.fillRect(x - 11, y + h/2 - 18, 22, 18);
                ctx.fillStyle = "#F1C40F";
                ctx.beginPath();
                ctx.arc(x - 6, y + h/2 - 10, 2, 0, 2*Math.PI);
                ctx.fill();
                // رقم الطابق
                ctx.font = "bold 16px 'Segoe UI'";
                ctx.fillStyle = "#4A2A1E";
                ctx.shadowBlur = 1;
                ctx.fillText(`${floorNum}`, x - 8, y + 6);
            } else {
                ctx.fillStyle = "#9C5E2C";
                ctx.fillRect(x - w/2 + 8, y - h/2, w-16, 5);
            }
        }
        
        // رسم الحبل والطابق المتأرجح
        function drawSwinging() {
            if(isGameActive && !waitingForLanding && !isFalling) {
                ctx.beginPath();
                ctx.moveTo(swingingFloor.pivotX, swingingFloor.pivotY);
                ctx.lineTo(swingingFloor.x, swingingFloor.y - swingingFloor.h/2 + 6);
                ctx.strokeStyle = "#8B5A2B";
                ctx.lineWidth = 3;
                ctx.stroke();
                drawFancyFloor(swingingFloor.x, swingingFloor.y, swingingFloor.w, swingingFloor.h, currentFloor+1, false);
            } else if(isFalling) {
                // رسم الطابق الساقط
                drawFancyFloor(fallPosX, fallPosY, fallWidth, fallHeight, fallFloorNumber, false);
            }
        }
        
        function drawBackground() {
            ctx.fillStyle = "#b0e2ff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // غيوم
            ctx.fillStyle = "#f9f3d9aa";
            ctx.beginPath();
            ctx.ellipse(80, 50, 45, 35, 0, 0, Math.PI*2);
            ctx.ellipse(120, 45, 50, 38, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(canvas.width-100, 70, 55, 40, 0, 0, Math.PI*2);
            ctx.ellipse(canvas.width-140, 65, 45, 35, 0, 0, Math.PI*2);
            ctx.fill();
        }
        
        function draw() {
            if(!ctx) return;
            drawBackground();
            // رسم جميع الطوابق المبنية
            for(let i=0;i<builtFloors.length;i++) {
                let f = builtFloors[i];
                if(f.isGround) {
                    ctx.fillStyle = "#B97F44";
                    ctx.fillRect(f.x - f.w/2, f.y - f.h/2, f.w, f.h);
                    ctx.fillStyle = "#9C5E2C";
                    ctx.fillRect(f.x - f.w/2+5, f.y - f.h/2, f.w-10, 6);
                } else {
                    drawFancyFloor(f.x, f.y, f.w, f.h, f.floorNumber, false);
                }
            }
            drawSwinging();
            // كتابة حماسية
            if(isGameActive && pendingProfit > 0) {
                ctx.font = "bold 26px 'Poppins'";
                ctx.fillStyle = "#FFD966";
                ctx.shadowBlur = 4;
                ctx.fillText(`🏆 ${Math.floor(pendingProfit)}`, canvas.width-110, 48);
            }
        }
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            // إعادة ضبط مواقع القاعدة والطوابق حسب الحجم الجديد
            addGround();
            if(!isGameActive && builtFloors.length === 0) addGround();
            resetSwingingFloor();
            if(isFalling) {
                // نحافظ على نفس الوضع النسبي للسقوط لكن نعيد ضبط بسيط
            }
        }
        
        // حلقة التحديث الرئيسية
        function gameLoop() {
            if(isFalling) {
                updateFall();
            }
            updateSwing();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // أحداث
        window.addEventListener('resize', () => { resizeCanvas(); });
        dropBtn.addEventListener('click', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if(!isGameActive) {
                startNewGame();
            } else {
                dropFloor();
            }
        });
        cashoutBtn.addEventListener('click', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            cashout();
        });
        resetBtn.addEventListener('click', () => {
            resetGameFull();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        });
        
        // بدء اللعبة
        resizeCanvas();
        addGround();
        updateUI();
        gameLoop();
        initAudio();
        // السماح بالصوت بعد أول تفاعل
        document.body.addEventListener('click', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
    })();
</script>
</body>
</html>

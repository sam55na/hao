<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>أبراج الحظ - بناء المتأرجح | كاميرا متحركة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(145deg, #0a2f2a 0%, #061a15 100%);
            font-family: 'Segoe UI', 'Poppins', 'Cairo', sans-serif;
            touch-action: pan-x pan-y;
        }

        .game-fullscreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 30% 20%, #2d6a4f33, #0a1f1a);
        }

        .canvas-area {
            flex: 1;
            min-height: 0;
            position: relative;
            background: #87CEEB;
            overflow: hidden;
            border-radius: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
        }

        /* الشريط السفلي - أزرار مدورة بجانب بعضها */
        .bottom-bar {
            background: #1a2a24e8;
            backdrop-filter: blur(20px);
            border-top: 1px solid #ffd966aa;
            padding: 14px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .balance-card {
            background: #000000aa;
            padding: 8px 20px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f9e7b3;
            font-weight: bold;
            font-size: 1.1rem;
            backdrop-filter: blur(4px);
        }

        .balance-card span {
            color: #ffd966;
            font-size: 1.5rem;
            font-weight: 900;
        }

        .bet-fixed {
            background: #e67e22dd;
            padding: 8px 24px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            backdrop-filter: blur(4px);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #ffb347;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 10px 28px;
            border-radius: 60px;
            color: #2d1f00;
            cursor: pointer;
            transition: 0.07s linear;
            box-shadow: 0 5px 0 #8b5a2b;
            font-family: inherit;
            min-width: 110px;
            letter-spacing: 0.5px;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #8b5a2b;
        }

        .cashout-btn {
            background: #2ecc71;
            box-shadow: 0 5px 0 #1f8f4b;
            color: white;
            text-shadow: 0 1px 1px darkgreen;
        }

        .reset-btn {
            background: #e67e22;
            box-shadow: 0 5px 0 #b45f1b;
        }

        .drop-btn {
            background: #3498db;
            box-shadow: 0 5px 0 #1f618d;
            color: white;
            font-size: 1.05rem;
        }

        .status-text {
            background: #000000aa;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.85rem;
            color: #ffe5a3;
        }

        .multiplier-badge {
            background: linear-gradient(135deg, gold, #ffb347);
            color: #1f3a2f;
            border-radius: 60px;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        @media (max-width: 750px) {
            .bottom-bar { gap: 8px; padding: 10px 12px; }
            button { padding: 7px 16px; font-size: 0.8rem; min-width: 75px; }
            .balance-card span { font-size: 1.2rem; }
            .balance-card { padding: 5px 12px; }
            .multiplier-badge { padding: 5px 12px; font-size: 0.7rem; }
            .status-text { font-size: 0.7rem; }
            .btn-group { gap: 6px; }
        }
    </style>
</head>
<body>
<div class="game-fullscreen">
    <div class="canvas-area">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div class="bottom-bar">
        <div class="balance-card">💰 الرصيد: <span id="balanceDisplay">2000</span></div>
        <div class="bet-fixed">🎲 الرهان: 2000</div>
        <div class="multiplier-badge" id="multiplierBadge">🏆 مضاعف: 0.00x</div>
        <div class="btn-group">
            <button id="dropBtn" class="drop-btn">⬇️ إفلات</button>
            <button id="cashoutBtn" class="cashout-btn">💰 جمع</button>
            <button id="resetBtn" class="reset-btn">🔄 إعادة</button>
        </div>
    </div>
    <div style="background: #0f1915dd; text-align: center; padding: 6px; font-size: 12px; color: #e6cba0;">
        <span id="gameStatusMsg">🏗️ اضغط "إفلات" لوضع الطابق (يلزم 50% تداخل) 🏗️</span>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        
        // مضاعفات الطوابق
        const MULTIPLIERS = {
            1: 0.5, 2: 0.7, 3: 0.9, 4: 1.1, 5: 1.3,
            6: 1.5, 7: 1.7, 8: 3.0, 9: 5.0, 10: 7.0,
            11: 9.0, 12: 11.0, 13: 15.0
        };
        const MAX_FLOOR = 13;
        const FIXED_BET = 2000;
        
        // حالة اللعبة
        let balance = 2000;
        let currentBet = 0;
        let currentFloor = 0;          // عدد الطوابق المبنية بنجاح
        let isGameActive = false;
        let pendingProfit = 0;
        
        // عناصر واجهة
        const balanceSpan = document.getElementById('balanceDisplay');
        const multiplierBadge = document.getElementById('multiplierBadge');
        const gameStatusSpan = document.getElementById('gameStatusMsg');
        const dropBtn = document.getElementById('dropBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // --- المتغيرات البصرية: كاميرا متحركة (offsetY) ---
        let cameraOffsetY = 0;      // مقدار إزاحة الكاميرا لأعلى (كل طابق يرفع الكاميرا)
        const FLOOR_HEIGHT_STEP = 52;  // كل طابق يبني نرفع الكاميرا بهذا المقدار
        
        // --- الطوابق المبنية ---
        let builtFloors = [];   // { x, y, w, h, floorNumber }
        
        // القاعدة الثابتة (ستتحرك مع الكاميرا ظاهرياً لكن إحداثياتها حقيقية)
        let ground = { x: 0, y: 0, w: 210, h: 24 };
        
        // --- الطابق المتأرجح (الحبل من خارج الشاشة) ---
        let swinging = {
            x: 0, y: 0,
            w: 45,            // عرض أقل بنسبة 50% (كان 90 سابقاً -> 45)
            h: 26,
            angle: 0,
            speed: 0.048,
            direction: 1,
            maxAngle: 0.85,
            pivotX: 0,
            pivotY: -25,      // نقطة تعليق خارج الشاشة (أعلى)
            ropeLength: 210
        };
        
        // --- السقوط الحر ---
        let isFalling = false;
        let fallVelY = 0;
        let fallPosX = 0, fallPosY = 0;
        let fallW = 45, fallH = 26;
        let fallFloorNum = 0;
        let waitingForLanding = false;
        
        // الصوت
        let audioCtx = null;
        let bgGain = null;
        let melodyInterval = null;
        let soundEnabled = true;
        
        // ========== وظائف الصوت ==========
        function initAudio() {
            if(audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgGain = audioCtx.createGain();
                bgGain.gain.value = 0.22;
                bgGain.connect(audioCtx.destination);
                playAmbientMelody();
            } catch(e){ console.log("audio not supported"); }
        }
        
        function playAmbientMelody() {
            if(melodyInterval) clearInterval(melodyInterval);
            melodyInterval = setInterval(() => {
                if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
                const notes = [262, 294, 330, 262, 349, 311];
                const idx = Math.floor(Math.random() * notes.length);
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(bgGain);
                osc.type = 'sine';
                osc.frequency.value = notes[idx];
                gainNode.gain.value = 0.09;
                osc.start();
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.6);
                osc.stop(audioCtx.currentTime + 1.5);
            }, 3400);
        }
        
        function playBuildSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'sine';
            osc.frequency.value = 523;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
            osc.stop(audioCtx.currentTime + 0.2);
        }
        
        function playWinSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'triangle';
            osc.frequency.value = 659;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.45);
            osc.stop(audioCtx.currentTime + 0.43);
            setTimeout(()=>{
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(bgGain);
                osc2.frequency.value = 784;
                gain2.gain.value = 0.18;
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
                osc2.stop(audioCtx.currentTime + 0.58);
            },100);
        }
        
        function playFailSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'sawtooth';
            osc.frequency.value = 150;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            osc.stop(audioCtx.currentTime + 0.48);
        }
        
        // ========== دوال مساعدة ==========
        function getMultiplier(floorNum) {
            if(floorNum <= 0) return 0;
            if(floorNum > MAX_FLOOR) return MULTIPLIERS[MAX_FLOOR];
            return MULTIPLIERS[floorNum] || 0.5;
        }
        
        function calcSwingSpeed(baseFloor) {
            let extra = Math.min(0.095, baseFloor * 0.008);
            return 0.048 + extra;
        }
        
        function updateUI() {
            balanceSpan.innerText = Math.floor(balance);
            if(isGameActive && currentFloor < MAX_FLOOR) {
                let nextMulti = getMultiplier(currentFloor+1);
                multiplierBadge.innerText = `🎯 مضاعف طابق ${currentFloor+1}: ${nextMulti.toFixed(2)}x`;
            } else if(isGameActive && currentFloor >= MAX_FLOOR){
                multiplierBadge.innerText = `🏆 اكتمل البرج! اجمع`;
            } else {
                multiplierBadge.innerText = `🏆 مضاعف: ---`;
            }
        }
        
        // إضافة القاعدة الأرضية (إحداثيات حقيقية)
        function addGround() {
            let groundY = canvas.height - 48;
            let groundX = canvas.width/2 - 105;
            ground = { x: groundX, y: groundY, w: 210, h: 24 };
            builtFloors = [];
            builtFloors.push({ 
                x: groundX + ground.w/2, 
                y: groundY + ground.h/2, 
                w: ground.w, 
                h: ground.h, 
                floorNumber: 0, 
                isGround: true 
            });
        }
        
        // إعادة ضبط الطابق المتأرجح (يعلق من أعلى خارج الشاشة)
        function resetSwingingPosition() {
            swinging.pivotX = canvas.width/2;
            swinging.pivotY = -20;    // خارج الشاشة من الأعلى
            swinging.angle = 0;
            swinging.direction = 1;
            updateSwingPosition();
        }
        
        function updateSwingPosition() {
            let offsetX = Math.sin(swinging.angle) * swinging.ropeLength;
            let centerX = swinging.pivotX + offsetX;
            let verticalOffset = (1 - Math.cos(swinging.angle * 0.65)) * 24;
            let centerY = swinging.pivotY + swinging.ropeLength * 0.75 + verticalOffset;
            swinging.x = centerX;
            swinging.y = centerY;
        }
        
        // تحديث حركة البندول (إذا لم يكن سقوط)
        function updateSwing() {
            if(isGameActive && !waitingForLanding && !isFalling && currentFloor < MAX_FLOOR) {
                swinging.angle += swinging.direction * swinging.speed;
                if(swinging.angle > swinging.maxAngle) {
                    swinging.angle = swinging.maxAngle;
                    swinging.direction = -1;
                } else if(swinging.angle < -swinging.maxAngle) {
                    swinging.angle = -swinging.maxAngle;
                    swinging.direction = 1;
                }
                updateSwingPosition();
            }
        }
        
        // بدء جولة (رهان 2000 ثابت)
        function startNewGame() {
            if(isGameActive) {
                gameStatusSpan.innerText = "⚠️ أنهِ الجولة أولاً!";
                return;
            }
            if(balance < FIXED_BET) {
                gameStatusSpan.innerText = "❌ رصيدك أقل من 2000! أعد التعيين.";
                return;
            }
            balance -= FIXED_BET;
            currentBet = FIXED_BET;
            pendingProfit = 0;
            currentFloor = 0;
            isGameActive = true;
            waitingForLanding = false;
            isFalling = false;
            cameraOffsetY = 0;   // إعادة الكاميرا للقاعدة
            // إعادة بناء القاعدة فقط
            addGround();
            // إعداد الطابق المتأرجح
            swinging.speed = calcSwingSpeed(0);
            resetSwingingPosition();
            
            updateUI();
            gameStatusSpan.innerText = "🎉 جولة جديدة! اضغط 'إفلات' لوضع الطابق الأول على القاعدة (يلزم تداخل 50%) 🎉";
            playBuildSound();
            initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        // إفلات الطابق (السقوط الحر)
        function dropFloor() {
            if(!isGameActive) {
                startNewGame();
                return;
            }
            if(waitingForLanding || isFalling) {
                gameStatusSpan.innerText = "الطابق في حالة سقوط بالفعل! انتظر.";
                return;
            }
            if(currentFloor >= MAX_FLOOR) {
                gameStatusSpan.innerText = "🏆 البرج مكتمل! قم بجمع الأرباح أولاً.";
                return;
            }
            fallPosX = swinging.x;
            fallPosY = swinging.y;
            fallW = swinging.w;
            fallH = swinging.h;
            fallFloorNum = currentFloor + 1;
            isFalling = true;
            waitingForLanding = true;
            fallVelY = 2.8;
            gameStatusSpan.innerText = `💨 الطابق ${fallFloorNum} يسقط... انتظر الارتطام 💨`;
        }
        
        // تحديث السقوط والتحقق من 50%
        function updateFall() {
            if(!isFalling) return false;
            fallVelY += 0.85;
            fallPosY += fallVelY;
            
            if(builtFloors.length === 0) return false;
            let lastFloor = builtFloors[builtFloors.length-1];
            let lastLeft = lastFloor.x - lastFloor.w/2;
            let lastRight = lastFloor.x + lastFloor.w/2;
            let lastTop = lastFloor.y - lastFloor.h/2;
            
            let fallLeft = fallPosX - fallW/2;
            let fallRight = fallPosX + fallW/2;
            let fallBottom = fallPosY + fallH/2;
            let fallTop = fallPosY - fallH/2;
            
            // التصادم العمودي (سقوط فوق السطح)
            if(fallBottom >= lastTop && fallTop <= lastTop + 15 && fallVelY >= 0) {
                let overlapLeft = Math.max(fallLeft, lastLeft);
                let overlapRight = Math.min(fallRight, lastRight);
                let overlapWidth = overlapRight - overlapLeft;
                let required = fallW * 0.5;
                if(overlapWidth >= required) {
                    // نجاح التثبيت
                    let newYpos = lastTop - fallH/2;
                    let newFloor = {
                        x: fallPosX,
                        y: newYpos,
                        w: fallW,
                        h: fallH,
                        floorNumber: fallFloorNum
                    };
                    builtFloors.push(newFloor);
                    currentFloor = fallFloorNum;
                    
                    let multiplier = getMultiplier(currentFloor);
                    pendingProfit = currentBet * multiplier;
                    
                    playBuildSound();
                    gameStatusSpan.innerText = `✅ الطابق ${currentFloor} ثبُت! مضاعف ${multiplier.toFixed(2)}x | الأرباح: ${Math.floor(pendingProfit)} اضغط "جمع"`;
                    updateUI();
                    
                    // رفع الكاميرا بمقدار طابق (للحفاظ على المسافة)
                    cameraOffsetY += FLOOR_HEIGHT_STEP;
                    
                    isFalling = false;
                    waitingForLanding = false;
                    
                    if(currentFloor < MAX_FLOOR) {
                        swinging.speed = calcSwingSpeed(currentFloor);
                        resetSwingingPosition();
                    } else {
                        gameStatusSpan.innerText = "🏆 أكملت البرج! اضغط جمع لسحب أرباحك 🏆";
                        playWinSound();
                    }
                    return true;
                } else {
                    gameStatusSpan.innerText = `💥 فشل! تداخل ${Math.floor(overlapWidth)}px من أصل ${Math.floor(required)}px مطلوب. خسارة!`;
                    loseGame();
                    return false;
                }
            }
            if(fallPosY + fallH/2 > canvas.height + 120) {
                gameStatusSpan.innerText = "💀 الطابق سقط خارج الحدود! خسارة 💀";
                loseGame();
                return false;
            }
            return true;
        }
        
        function loseGame() {
            if(!isGameActive) return;
            playFailSound();
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            isFalling = false;
            waitingForLanding = false;
            cameraOffsetY = 0;
            addGround();
            updateUI();
            gameStatusSpan.innerText = "😭 خسارة! ابدأ جولة جديدة (إعادة أو اضغط إفلات) 😭";
        }
        
        function cashout() {
            if(!isGameActive) {
                gameStatusSpan.innerText = "لا توجد أرباح نشطة! ابدأ جولة.";
                return;
            }
            if(pendingProfit <= 0 || currentFloor === 0) {
                gameStatusSpan.innerText = "⚠️ لم تحقق أي أرباح بعد! ابنِ طابقاً أولاً.";
                return;
            }
            let profit = Math.floor(pendingProfit);
            balance += profit;
            playWinSound();
            gameStatusSpan.innerText = `💰 تم جمع ${profit} ! رصيدك الآن ${Math.floor(balance)} 💰`;
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            cameraOffsetY = 0;
            addGround();
            updateUI();
        }
        
        function resetGame() {
            balance = 2000;
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            isFalling = false;
            waitingForLanding = false;
            cameraOffsetY = 0;
            addGround();
            updateUI();
            gameStatusSpan.innerText = "🔄 إعادة تعيين. الرصيد 2000. ابدأ بالرهان (اضغط إفلات)";
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        // رسم الطابق مع شباكين وباب (عرض أقل)
        function drawFancyFloor(x, y, w, h, floorNum, isGround=false) {
            ctx.fillStyle = "#DEB887";
            ctx.shadowBlur = 2;
            ctx.fillRect(x - w/2, y - h/2, w, h);
            ctx.fillStyle = "#C19A6B";
            ctx.fillRect(x - w/2 + 4, y - h/2, w - 8, 5);
            if(!isGround) {
                // شباكان صغيران
                ctx.fillStyle = "#87CEEB";
                ctx.fillRect(x - w/3 - 4, y - 4, 13, 13);
                ctx.fillRect(x + w/3 - 9, y - 4, 13, 13);
                ctx.fillStyle = "#2C3E50";
                ctx.fillRect(x - w/3 - 3, y - 3, 11, 11);
                ctx.fillRect(x + w/3 - 8, y - 3, 11, 11);
                // باب
                ctx.fillStyle = "#8B4513";
                ctx.fillRect(x - 9, y + h/2 - 16, 18, 16);
                ctx.fillStyle = "#F1C40F";
                ctx.beginPath();
                ctx.arc(x - 5, y + h/2 - 8, 2, 0, 2*Math.PI);
                ctx.fill();
                ctx.font = "bold 13px 'Segoe UI'";
                ctx.fillStyle = "#4A2A1E";
                ctx.fillText(`${floorNum}`, x - 7, y + 5);
            } else {
                ctx.fillStyle = "#9C5E2C";
                ctx.fillRect(x - w/2 + 6, y - h/2, w-12, 5);
            }
        }
        
        // رسم الكاميرا المتحولة: نطبق إزاحة على كل العناصر
        function drawWithCamera() {
            ctx.save();
            ctx.translate(0, -cameraOffsetY);   // تحريك العالم لأعلى مع كل طابق
            
            // خلفية متحركة
            ctx.fillStyle = "#b0e2ff";
            ctx.fillRect(0, 0, canvas.width, canvas.height + cameraOffsetY);
            ctx.fillStyle = "#f9f3d9aa";
            ctx.beginPath();
            ctx.ellipse(100, 50 + cameraOffsetY*0.3, 45, 35, 0, 0, Math.PI*2);
            ctx.ellipse(150, 45 + cameraOffsetY*0.3, 50, 38, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(canvas.width-120, 70 + cameraOffsetY*0.2, 55, 40, 0, 0, Math.PI*2);
            ctx.ellipse(canvas.width-160, 65 + cameraOffsetY*0.2, 45, 35, 0, 0, Math.PI*2);
            ctx.fill();
            
            // رسم جميع الطوابق المبنية
            for(let i=0;i<builtFloors.length;i++) {
                let f = builtFloors[i];
                if(f.isGround) {
                    ctx.fillStyle = "#B97F44";
                    ctx.fillRect(f.x - f.w/2, f.y - f.h/2, f.w, f.h);
                    ctx.fillStyle = "#9C5E2C";
                    ctx.fillRect(f.x - f.w/2+5, f.y - f.h/2, f.w-10, 6);
                } else {
                    drawFancyFloor(f.x, f.y, f.w, f.h, f.floorNumber, false);
                }
            }
            
            // رسم الطابق المتأرجح أو الساقط
            if(isGameActive && !waitingForLanding && !isFalling && currentFloor < MAX_FLOOR) {
                ctx.beginPath();
                ctx.moveTo(swinging.pivotX, swinging.pivotY);
                ctx.lineTo(swinging.x, swinging.y - swinging.h/2 + 5);
                ctx.strokeStyle = "#8B5A2B";
                ctx.lineWidth = 3;
                ctx.stroke();
                drawFancyFloor(swinging.x, swinging.y, swinging.w, swinging.h, currentFloor+1, false);
            } else if(isFalling) {
                drawFancyFloor(fallPosX, fallPosY, fallW, fallH, fallFloorNum, false);
            }
            
            // عرض الأرباح الحالية أعلى الشاشة (بالنسبة للكاميرا)
            if(isGameActive && pendingProfit > 0) {
                ctx.font = "bold 28px 'Poppins'";
                ctx.fillStyle = "#FFD966";
                ctx.shadowBlur = 6;
                ctx.fillText(`🏆 ${Math.floor(pendingProfit)}`, canvas.width-130, 50 + cameraOffsetY);
            }
            ctx.restore();
        }
        
        // resize
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            addGround();
            resetSwingingPosition();
            if(isFalling) {
                // الحفاظ على السقوط
            }
        }
        
        // حلقة الرسم
        function gameLoop() {
            if(isFalling) updateFall();
            updateSwing();
            drawWithCamera();
            requestAnimationFrame(gameLoop);
        }
        
        // أحداث
        window.addEventListener('resize', ()=>{ resizeCanvas(); });
        dropBtn.addEventListener('click', ()=>{
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if(!isGameActive) startNewGame();
            else dropFloor();
        });
        cashoutBtn.addEventListener('click', ()=>{
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            cashout();
        });
        resetBtn.addEventListener('click', ()=>{
            resetGame();
        });
        
        resizeCanvas();
        addGround();
        resetSwingingPosition();
        updateUI();
        gameLoop();
        initAudio();
        document.body.addEventListener('click', ()=>{
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
    })();
</script>
</body>
</html>

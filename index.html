<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>البرج الذهبي - لعبة البناء المتأرجح</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', 'Poppins', 'Cairo', system-ui, sans-serif;
        }

        .game-fullscreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000000;
        }

        .canvas-area {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background: #0a0a2a;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
        }

        /* الشريط السفلي - تصميم فاخر بألوان أسود/ذهبي */
        .bottom-bar {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            backdrop-filter: blur(20px);
            border-top: 2px solid #FFD700;
            padding: 14px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,215,0,0.3);
            z-index: 10;
        }

        .balance-card {
            background: linear-gradient(145deg, #000000, #1a1a1a);
            padding: 8px 22px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #FFD700;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid #FFD70055;
            box-shadow: 0 0 12px rgba(255,215,0,0.3);
        }

        .balance-card span {
            color: #FFD700;
            font-size: 1.6rem;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(255,215,0,0.5);
        }

        .bet-fixed {
            background: linear-gradient(145deg, #FFD700, #DAA520);
            padding: 8px 24px;
            border-radius: 60px;
            color: #000000;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #FFF0AA;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* أزرار بمظهر لامع وتدرج لوني ذهبي وأسود */
        button {
            border: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 10px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
            min-width: 110px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #FFD700;
            border: 1px solid #FFD70055;
            box-shadow: 0 6px 0 #000000, 0 0 12px rgba(255,215,0,0.2);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #000000;
        }

        .drop-btn {
            background: linear-gradient(135deg, #FFD700, #B8860B);
            color: #000000;
            font-weight: 900;
            border: 1px solid #FFF8DC;
            box-shadow: 0 6px 0 #8B6914, 0 0 15px rgba(255,215,0,0.6);
        }

        .cashout-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: 1px solid #a8ffd0;
            box-shadow: 0 6px 0 #1f8f4b;
        }

        .reset-btn {
            background: linear-gradient(135deg, #e67e22, #b45f1b);
            color: white;
            border: 1px solid #ffcc88;
            box-shadow: 0 6px 0 #8B4513;
        }

        .multiplier-badge {
            background: linear-gradient(145deg, #000000, #1c1c1c);
            color: #FFD700;
            border-radius: 60px;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #FFD700;
            box-shadow: 0 0 12px rgba(255,215,0,0.4);
        }

        .status-text {
            background: #000000cc;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.85rem;
            color: #FFD700;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 750px) {
            .bottom-bar { gap: 8px; padding: 10px 12px; }
            button { padding: 7px 16px; font-size: 0.8rem; min-width: 75px; }
            .balance-card span { font-size: 1.2rem; }
            .balance-card { padding: 5px 12px; }
            .multiplier-badge { padding: 5px 12px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="game-fullscreen">
    <div class="canvas-area">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div class="bottom-bar">
        <div class="balance-card">💰 الرصيد: <span id="balanceDisplay">2000</span></div>
        <div class="bet-fixed">🎲 الرهان: 2000</div>
        <div class="multiplier-badge" id="multiplierBadge">🏆 مضاعف: 0.00x</div>
        <div class="btn-group">
            <button id="dropBtn" class="drop-btn">⬇️ إفلات</button>
            <button id="cashoutBtn" class="cashout-btn">💰 جمع</button>
            <button id="resetBtn" class="reset-btn">🔄 إعادة</button>
        </div>
    </div>
    <div style="background: #000000dd; text-align: center; padding: 6px; font-size: 12px; color: #FFD700; border-top: 1px solid #FFD70033;">
        <span id="gameStatusMsg">✨ اضغط "إفلات" لوضع الطابق (يلزم تداخل 50%) ✨</span>
    </div>
</div>

<script>
    (function(){
        // ------------------- آليات اللعبة الرئيسية -------------------
        const canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        
        // المضاعفات الثابتة
        const MULTIPLIERS = {
            1: 0.5, 2: 0.7, 3: 0.9, 4: 1.1, 5: 1.3,
            6: 1.5, 7: 1.7, 8: 3.0, 9: 5.0, 10: 7.0,
            11: 9.0, 12: 11.0, 13: 15.0
        };
        const MAX_FLOOR = 13;
        const FIXED_BET = 2000;
        
        // حالة اللعبة الأساسية
        let balance = 2000;
        let currentBet = 0;
        let currentFloor = 0;
        let isGameActive = false;
        let pendingProfit = 0;
        
        // عناصر واجهة
        const balanceSpan = document.getElementById('balanceDisplay');
        const multiplierBadge = document.getElementById('multiplierBadge');
        const gameStatusSpan = document.getElementById('gameStatusMsg');
        const dropBtn = document.getElementById('dropBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // ---------- كاميرا مستقرة (بدون اهتزاز دائم) ----------
        let cameraY = 0;           // إزاحة الكاميرا (ترتفع مع البناء فقط)
        let shakeIntensity = 0;    // شدة الاهتزاز
        let shakeDuration = 0;     // مدة الاهتزاز
        
        // إضافة اهتزاز لحظي عند بناء طابق
        function addShake(intensity = 8, duration = 180) {
            shakeIntensity = intensity;
            shakeDuration = duration;
        }
        
        // تحديث الاهتزاز (يقل تدريجياً)
        function updateShake() {
            if(shakeDuration > 0) {
                shakeDuration -= 16;
                if(shakeDuration <= 0) shakeIntensity = 0;
            } else {
                shakeIntensity = 0;
            }
        }
        
        function getShakeOffset() {
            if(shakeIntensity <= 0) return { x: 0, y: 0 };
            return {
                x: (Math.random() - 0.5) * shakeIntensity,
                y: (Math.random() - 0.5) * shakeIntensity * 0.6
            };
        }
        
        // ---------- الطيور (للتشتيت) ----------
        let birds = [];
        for(let i = 0; i < 6; i++) {
            birds.push({
                x: Math.random() * 2000 - 500,
                y: 80 + Math.random() * 180,
                size: 14 + Math.random() * 12,
                speed: 0.6 + Math.random() * 1.2,
                wing: 0
            });
        }
        
        function updateBirds() {
            for(let bird of birds) {
                bird.x += bird.speed;
                bird.wing = (bird.wing + 0.12) % (Math.PI * 2);
                if(bird.x > canvas.width + 300) bird.x = -250;
            }
        }
        
        // رسم الطيور
        function drawBirds(camY) {
            for(let bird of birds) {
                ctx.save();
                ctx.translate(bird.x, bird.y + camY * 0.1);
                ctx.fillStyle = "#2c2c2c";
                ctx.beginPath();
                let wingAngle = Math.sin(bird.wing) * 0.7;
                // جناح أول
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-bird.size * 0.6, -bird.size * 0.4 + wingAngle * 5, -bird.size, -bird.size * 0.3);
                ctx.quadraticCurveTo(-bird.size * 0.5, 0, 0, 0);
                ctx.fillStyle = "#1a1a1a";
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(bird.size * 0.6, -bird.size * 0.4 - wingAngle * 3, bird.size, -bird.size * 0.3);
                ctx.quadraticCurveTo(bird.size * 0.5, 0, 0, 0);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, 2, bird.size * 0.2, 0, Math.PI*2);
                ctx.fillStyle = "#FFD700";
                ctx.fill();
                ctx.restore();
            }
        }
        
        // ---------- عناصر البناء ----------
        let builtFloors = [];     // الطوابق الثابتة
        let ground = { x: 0, y: 0, w: 210, h: 26 };
        
        // الطابق المتأرجح (عرض أقل: 48px)
        let swinging = {
            x: 0, y: 0, w: 48, h: 28,
            angle: 0, speed: 0.048, direction: 1, maxAngle: 0.85,
            pivotX: 0, pivotY: -30, ropeLength: 210
        };
        
        // حالة السقوط
        let isFalling = false;
        let fallVelY = 0;
        let fallPosX = 0, fallPosY = 0;
        let fallW = 48, fallH = 28;
        let fallFloorNum = 0;
        let waitingForLanding = false;
        
        // ألوان الطوابق المتعددة (ذهبي، أسود، رمادي ذهبي)
        const floorColors = [
            "#1a1a1a", "#2d2d2d", "#FFD700", "#B8860B", "#DAA520", 
            "#1f1f1f", "#FFC125", "#F0E68C", "#8B6914", "#FFD700",
            "#CDAD00", "#FFF8DC", "#D4AF37"
        ];
        
        function getFloorColor(floorNum) {
            if(floorNum === 0) return "#4a3b1a";
            return floorColors[(floorNum - 1) % floorColors.length];
        }
        
        // رسم طابق بتفاصيل (شباكين وباب)
        function drawFancyFloor(x, y, w, h, floorNum, isGround = false) {
            const mainColor = isGround ? "#3a2a1a" : getFloorColor(floorNum);
            const darkEdge = isGround ? "#2a1a0a" : "#000000aa";
            ctx.fillStyle = mainColor;
            ctx.shadowBlur = 4;
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.fillRect(x - w/2, y - h/2, w, h);
            // حافة ذهبية عليا
            ctx.fillStyle = "#FFD700";
            ctx.fillRect(x - w/2 + 4, y - h/2, w - 8, 4);
            ctx.fillStyle = darkEdge;
            ctx.fillRect(x - w/2 + 2, y - h/2 + 4, w - 4, 3);
            
            if(!isGround) {
                // شباكان صغيران بلمعة ذهبية
                ctx.fillStyle = "#FFF8DC";
                ctx.fillRect(x - w/3 - 5, y - 3, 12, 12);
                ctx.fillRect(x + w/3 - 7, y - 3, 12, 12);
                ctx.fillStyle = "#000000";
                ctx.fillRect(x - w/3 - 4, y - 2, 10, 10);
                ctx.fillRect(x + w/3 - 6, y - 2, 10, 10);
                ctx.fillStyle = "#FFD700";
                ctx.fillRect(x - w/3 - 4, y - 2, 3, 10);
                ctx.fillRect(x + w/3 - 6, y - 2, 3, 10);
                // باب ذهبي
                ctx.fillStyle = "#B8860B";
                ctx.fillRect(x - 9, y + h/2 - 16, 18, 16);
                ctx.fillStyle = "#FFD700";
                ctx.beginPath();
                ctx.arc(x - 5, y + h/2 - 9, 2.5, 0, 2*Math.PI);
                ctx.fill();
                // رقم الطابق بالذهب
                ctx.font = "bold 12px 'Segoe UI'";
                ctx.fillStyle = "#FFD700";
                ctx.shadowBlur = 3;
                ctx.fillText(`${floorNum}`, x - 6, y + 5);
            } else {
                ctx.fillStyle = "#FFD700";
                ctx.fillRect(x - w/2 + 8, y - h/2, w-16, 4);
            }
        }
        
        // إضافة القاعدة
        function addGround() {
            let groundY = canvas.height - 48;
            let groundX = canvas.width/2 - 105;
            ground = { x: groundX, y: groundY, w: 210, h: 26 };
            builtFloors = [];
            builtFloors.push({
                x: groundX + ground.w/2,
                y: groundY + ground.h/2,
                w: ground.w,
                h: ground.h,
                floorNumber: 0,
                isGround: true
            });
        }
        
        // تحديث موقع البندول
        function updateSwingPosition() {
            let offsetX = Math.sin(swinging.angle) * swinging.ropeLength;
            let centerX = swinging.pivotX + offsetX;
            let verticalOffset = (1 - Math.cos(swinging.angle * 0.65)) * 22;
            let centerY = swinging.pivotY + swinging.ropeLength * 0.75 + verticalOffset;
            swinging.x = centerX;
            swinging.y = centerY;
        }
        
        function resetSwingingPosition() {
            swinging.pivotX = canvas.width/2;
            swinging.pivotY = -30;
            swinging.angle = 0;
            swinging.direction = 1;
            updateSwingPosition();
        }
        
        function updateSwing() {
            if(isGameActive && !waitingForLanding && !isFalling && currentFloor < MAX_FLOOR) {
                swinging.angle += swinging.direction * swinging.speed;
                if(swinging.angle > swinging.maxAngle) {
                    swinging.angle = swinging.maxAngle;
                    swinging.direction = -1;
                } else if(swinging.angle < -swinging.maxAngle) {
                    swinging.angle = -swinging.maxAngle;
                    swinging.direction = 1;
                }
                updateSwingPosition();
            }
        }
        
        function calcSwingSpeed(baseFloor) {
            let extra = Math.min(0.095, baseFloor * 0.008);
            return 0.048 + extra;
        }
        
        function getMultiplier(floorNum) {
            if(floorNum <= 0) return 0;
            if(floorNum > MAX_FLOOR) return MULTIPLIERS[MAX_FLOOR];
            return MULTIPLIERS[floorNum];
        }
        
        function updateUI() {
            balanceSpan.innerText = Math.floor(balance);
            if(isGameActive && currentFloor < MAX_FLOOR) {
                let nextMulti = getMultiplier(currentFloor+1);
                multiplierBadge.innerText = `🎯 مضاعف طابق ${currentFloor+1}: ${nextMulti.toFixed(2)}x`;
            } else if(isGameActive && currentFloor >= MAX_FLOOR) {
                multiplierBadge.innerText = `🏆 اكتمل البرج!`;
            } else {
                multiplierBadge.innerText = `🏆 مضاعف: ---`;
            }
        }
        
        // بدء الجولة (رهان ثابت 2000)
        function startNewGame() {
            if(isGameActive) {
                gameStatusSpan.innerText = "⚠️ أنهِ الجولة أولاً!";
                return;
            }
            if(balance < FIXED_BET) {
                gameStatusSpan.innerText = "❌ رصيدك أقل من 2000! أعد التعيين.";
                return;
            }
            balance -= FIXED_BET;
            currentBet = FIXED_BET;
            pendingProfit = 0;
            currentFloor = 0;
            isGameActive = true;
            waitingForLanding = false;
            isFalling = false;
            cameraY = 0;
            addGround();
            swinging.speed = calcSwingSpeed(0);
            resetSwingingPosition();
            updateUI();
            gameStatusSpan.innerText = "🎉 جولة جديدة! اضغط 'إفلات' لوضع الطابق الأول 🎉";
            playBuildSound();
            initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        function dropFloor() {
            if(!isGameActive) {
                startNewGame();
                return;
            }
            if(waitingForLanding || isFalling) {
                gameStatusSpan.innerText = "الطابق في حالة سقوط! انتظر.";
                return;
            }
            if(currentFloor >= MAX_FLOOR) {
                gameStatusSpan.innerText = "🏆 البرج مكتمل! قم بجمع الأرباح.";
                return;
            }
            fallPosX = swinging.x;
            fallPosY = swinging.y;
            fallW = swinging.w;
            fallH = swinging.h;
            fallFloorNum = currentFloor + 1;
            isFalling = true;
            waitingForLanding = true;
            fallVelY = 3.0;
            gameStatusSpan.innerText = `💨 الطابق ${fallFloorNum} يسقط... انتظر الارتطام 💨`;
        }
        
        function updateFall() {
            if(!isFalling) return false;
            fallVelY += 0.85;
            fallPosY += fallVelY;
            
            if(builtFloors.length === 0) return false;
            let lastFloor = builtFloors[builtFloors.length-1];
            let lastLeft = lastFloor.x - lastFloor.w/2;
            let lastRight = lastFloor.x + lastFloor.w/2;
            let lastTop = lastFloor.y - lastFloor.h/2;
            
            let fallLeft = fallPosX - fallW/2;
            let fallRight = fallPosX + fallW/2;
            let fallBottom = fallPosY + fallH/2;
            
            if(fallBottom >= lastTop && fallPosY - fallH/2 <= lastTop + 15 && fallVelY >= 0) {
                let overlapLeft = Math.max(fallLeft, lastLeft);
                let overlapRight = Math.min(fallRight, lastRight);
                let overlapWidth = overlapRight - overlapLeft;
                let required = fallW * 0.5;
                if(overlapWidth >= required) {
                    let newYpos = lastTop - fallH/2;
                    let newFloor = {
                        x: fallPosX,
                        y: newYpos,
                        w: fallW,
                        h: fallH,
                        floorNumber: fallFloorNum
                    };
                    builtFloors.push(newFloor);
                    currentFloor = fallFloorNum;
                    
                    let multiplier = getMultiplier(currentFloor);
                    pendingProfit = currentBet * multiplier;
                    
                    playBuildSound();
                    // إضافة اهتزاز لحظي عند البناء (لا اهتزاز دائم)
                    addShake(7, 160);
                    
                    // رفع الكاميرا بمقدار ثابت (لا تقترب)
                    cameraY += 46;
                    
                    gameStatusSpan.innerText = `✅ الطابق ${currentFloor} ثبُت! مضاعف ${multiplier.toFixed(2)}x | الأرباح: ${Math.floor(pendingProfit)}`;
                    updateUI();
                    
                    isFalling = false;
                    waitingForLanding = false;
                    
                    if(currentFloor < MAX_FLOOR) {
                        swinging.speed = calcSwingSpeed(currentFloor);
                        resetSwingingPosition();
                    } else {
                        gameStatusSpan.innerText = "🏆 أكملت البرج! اضغط جمع لسحب أرباحك 🏆";
                        playWinSound();
                    }
                    return true;
                } else {
                    gameStatusSpan.innerText = `💥 فشل! تداخل ${Math.floor(overlapWidth)}px من أصل ${Math.floor(required)}px مطلوب. خسارة!`;
                    loseGame();
                    return false;
                }
            }
            if(fallPosY + fallH/2 > canvas.height + 120) {
                loseGame();
                return false;
            }
            return true;
        }
        
        function loseGame() {
            if(!isGameActive) return;
            playFailSound();
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            isFalling = false;
            waitingForLanding = false;
            cameraY = 0;
            addGround();
            updateUI();
            gameStatusSpan.innerText = "😭 خسارة! ابدأ جولة جديدة (إفلات) 😭";
            addShake(5, 120);
        }
        
        function cashout() {
            if(!isGameActive) {
                gameStatusSpan.innerText = "لا توجد أرباح نشطة!";
                return;
            }
            if(pendingProfit <= 0 || currentFloor === 0) {
                gameStatusSpan.innerText = "⚠️ لم تحقق أرباحاً بعد! ابنِ طابقاً أولاً.";
                return;
            }
            let profit = Math.floor(pendingProfit);
            balance += profit;
            playWinSound();
            gameStatusSpan.innerText = `💰 تم جمع ${profit} ! رصيدك الآن ${Math.floor(balance)} 💰`;
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            cameraY = 0;
            addGround();
            updateUI();
            addShake(3, 100);
        }
        
        function resetGame() {
            balance = 2000;
            isGameActive = false;
            currentBet = 0;
            pendingProfit = 0;
            currentFloor = 0;
            builtFloors = [];
            isFalling = false;
            waitingForLanding = false;
            cameraY = 0;
            addGround();
            updateUI();
            gameStatusSpan.innerText = "🔄 إعادة تعيين. الرصيد 2000. ابدأ بالرهان";
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        // ---------- الرسم الرئيسي مع الكاميرا والاهتزاز ----------
        function drawWithCamera() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // خلفية سوداء/ذهبية ثابتة
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, "#0a0a1a");
            grad.addColorStop(1, "#000000");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // نجوم لامعة (ذهبية)
            ctx.fillStyle = "#FFD700";
            for(let i = 0; i < 120; i++) {
                if(i%2 === 0) continue;
                ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.001 + i) * 0.2;
                ctx.fillRect( (i * 131) % canvas.width, (i * 57) % canvas.height, 2, 2);
            }
            ctx.globalAlpha = 1;
            
            // تطبيق اهتزاز و إزاحة الكاميرا
            let shake = getShakeOffset();
            ctx.save();
            ctx.translate(shake.x, shake.y - cameraY);
            
            // رسم الطوابق المبنية (بألوان متعددة)
            for(let i=0; i<builtFloors.length; i++) {
                let f = builtFloors[i];
                if(f.isGround) {
                    ctx.fillStyle = "#2a2a1a";
                    ctx.fillRect(f.x - f.w/2, f.y - f.h/2, f.w, f.h);
                    ctx.fillStyle = "#FFD700";
                    ctx.fillRect(f.x - f.w/2 + 5, f.y - f.h/2, f.w-10, 4);
                } else {
                    drawFancyFloor(f.x, f.y, f.w, f.h, f.floorNumber, false);
                }
            }
            
            // رسم الطابق المتأرجح أو الساقط
            if(isGameActive && !waitingForLanding && !isFalling && currentFloor < MAX_FLOOR) {
                ctx.beginPath();
                ctx.moveTo(swinging.pivotX, swinging.pivotY);
                ctx.lineTo(swinging.x, swinging.y - swinging.h/2 + 5);
                ctx.strokeStyle = "#FFD700";
                ctx.lineWidth = 3;
                ctx.shadowBlur = 6;
                ctx.stroke();
                drawFancyFloor(swinging.x, swinging.y, swinging.w, swinging.h, currentFloor+1, false);
            } else if(isFalling) {
                drawFancyFloor(fallPosX, fallPosY, fallW, fallH, fallFloorNum, false);
            }
            
            // عرض الأرباح الحالية بلمعة ذهبية
            if(isGameActive && pendingProfit > 0) {
                ctx.font = "bold 28px 'Poppins'";
                ctx.fillStyle = "#FFD700";
                ctx.shadowBlur = 8;
                ctx.shadowColor = "black";
                ctx.fillText(`💰 ${Math.floor(pendingProfit)}`, canvas.width-130, 55 + cameraY);
            }
            
            ctx.restore(); // نهاية الكاميرا والاهتزاز
            
            // رسم الطيور (خارج الكاميرا لتشتيت الانتباه)
            drawBirds(cameraY * 0.05);
            
            // إطار ذهبي حول الشاشة
            ctx.strokeStyle = "#FFD700";
            ctx.lineWidth = 3;
            ctx.strokeRect(5, 5, canvas.width-10, canvas.height-10);
        }
        
        // ---------- الصوتيات ----------
        let audioCtx = null;
        let bgGain = null;
        let melodyInterval = null;
        let soundEnabled = true;
        
        function initAudio() {
            if(audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgGain = audioCtx.createGain();
                bgGain.gain.value = 0.18;
                bgGain.connect(audioCtx.destination);
                playAmbientMelody();
            } catch(e){ console.log("audio not supported"); }
        }
        
        function playAmbientMelody() {
            if(melodyInterval) clearInterval(melodyInterval);
            melodyInterval = setInterval(() => {
                if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
                const notes = [262, 294, 330, 349, 392];
                const idx = Math.floor(Math.random() * notes.length);
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(bgGain);
                osc.type = 'sine';
                osc.frequency.value = notes[idx];
                gainNode.gain.value = 0.07;
                osc.start();
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.7);
                osc.stop(audioCtx.currentTime + 1.6);
            }, 3800);
        }
        
        function playBuildSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'sine';
            osc.frequency.value = 587.33;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.18);
        }
        
        function playWinSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'triangle';
            osc.frequency.value = 659.25;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.38);
            setTimeout(()=>{
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(bgGain);
                osc2.frequency.value = 783.99;
                gain2.gain.value = 0.18;
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc2.stop(audioCtx.currentTime + 0.48);
            },100);
        }
        
        function playFailSound() {
            if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(bgGain);
            osc.type = 'sawtooth';
            osc.frequency.value = 150;
            gainNode.gain.value = 0.2;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.45);
            osc.stop(audioCtx.currentTime + 0.43);
        }
        
        // resize والحدث
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            addGround();
            resetSwingingPosition();
        }
        
        function gameLoop() {
            updateShake();
            if(isFalling) updateFall();
            updateSwing();
            updateBirds();
            drawWithCamera();
            requestAnimationFrame(gameLoop);
        }
        
        // ربط الأزرار
        window.addEventListener('resize', resizeCanvas);
        dropBtn.addEventListener('click', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if(!isGameActive) startNewGame();
            else dropFloor();
        });
        cashoutBtn.addEventListener('click', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            cashout();
        });
        resetBtn.addEventListener('click', () => {
            resetGame();
        });
        
        resizeCanvas();
        addGround();
        resetSwingingPosition();
        updateUI();
        gameLoop();
        initAudio();
        document.body.addEventListener('click', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
    })();
</script>
</body>
</html>
